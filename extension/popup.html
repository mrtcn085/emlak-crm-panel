<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
body{width:360px;font-family:Arial;margin:0;padding:12px;background:#f6f7fb;color:#111827}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.field{display:flex;flex-direction:column;gap:4px;margin:7px 0}input{padding:8px;border:1px solid #d1d5db;border-radius:8px}button{border:0;border-radius:8px;background:#111827;color:white;padding:9px 11px;cursor:pointer;margin:3px}.muted{font-size:12px;color:#64748b}.ok{color:#166534}.err{color:#dc2626}</style></head><body>
<h3>Emlak CRM Cloud</h3>
<div class="box"><b>Ayarlar</b><div class="field"><label>Supabase URL</label><input id="url" placeholder="https://xxxx.supabase.co"></div><div class="field"><label>Publishable / anon key</label><input id="key"></div><div class="field"><label>E-posta</label><input id="email"></div><div class="field"><label>Şifre</label><input id="pass" type="password"></div><button id="saveSettings">Ayarları Kaydet</button><button id="login">Giriş Yap</button><div id="loginStatus" class="muted"></div></div>
<div class="box"><button id="saveListing">Bu ilanı CRM'e kaydet</button><div id="status" class="muted">Önce Supabase ayarlarını girip giriş yap.</div></div>
<script src="popup.js"></script></body></html>
